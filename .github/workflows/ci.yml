name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs when a new push lands on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # NOTE: `build` + `test` (e2e/int) jobs need Postgres + migrations → added in Phase 12
  # (Postgres service container + `payload migrate` + DATABASE_URL/PAYLOAD_SECRET secrets).
