name: Generate baseline migration

# One-shot helper: generate the Payload baseline DB migration on Linux and commit
# it back. Needed because `payload migrate:create` fails on Windows (tsx + drizzle-kit
# `node:crypto?tsx-namespace` bug on Node 24). Run manually from the Actions tab.
# `migrate:create` uses disableDBConnect, so no real database is required to generate.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name
        required: true
        default: initial

permissions:
  contents: write

jobs:
  generate:
    name: Generate + commit migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marclie_miggen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # migrate:create generates from config (disableDBConnect), but payload.init still
      # opens a pool, so DATABASE_URL must point at a reachable (empty) database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marclie_miggen
      PAYLOAD_SECRET: ci-dummy-secret-for-migration-generation-only
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate migration
        run: pnpm exec payload migrate:create "${{ github.event.inputs.name }}" --forceAcceptWarning

      - name: Commit migration
        run: |
          if git status --porcelain src/migrations | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/migrations
            git commit -m "chore(db): baseline migration (${{ github.event.inputs.name }}) [skip ci]"
            git push
            echo "Migration committed and pushed."
          else
            echo "::warning::No migration files were generated (no schema changes detected)."
          fi
